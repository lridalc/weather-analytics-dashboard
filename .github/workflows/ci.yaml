name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # PHASE 1: FAST CHECKS (PARALLEL)
  # These jobs validate code quality and basic application startup.
  # They run in parallel for maximum speed and fail fast.
  # ===========================================================================

  quality:
    name: 📋 Code Quality
    uses: ./.github/workflows/quality.yml

  smoke:
    name: 🚦 Smoke Tests
    uses: ./.github/workflows/smoke.yml

  bootstrap:
    name: 🔧 Bootstrap Configuration
    uses: ./.github/workflows/bootstrap.yml

  # ===========================================================================
  # PHASE 2: UNIT TESTS (SEQUENTIAL - depends on Phase 1)
  # Domain and Application layer tests.
  # Only runs if all Phase 1 jobs pass.
  # ===========================================================================

  unit:
    name: 🧪 Unit Tests (Domain + Application)
    needs: [quality, smoke, bootstrap]
    runs-on: ubuntu-latest
    if: success()  # Only run if all Phase 1 jobs succeed

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  # ===========================================================================
  # PHASE 3: INTEGRATION TESTS (SEQUENTIAL - depends on Phase 2)
  # Infrastructure and Presentation layer tests.
  # Bootstrap tests are excluded (already run in Phase 1).
  # Only runs if all Phase 2 jobs pass.
  # ===========================================================================

  integration:
    name: 🔗 Integration Tests (Infrastructure + API)
    needs: [unit]
    runs-on: ubuntu-latest
    if: success()  # Only run if all Phase 2 jobs succeed

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run integration tests (exclude bootstrap)
        run: |
          uv run pytest tests/integration/ \
            --ignore=tests/integration/bootstrap/ \
            -v --tb=short

  # ===========================================================================
  # PHASE 4: SUMMARY
  # Provides a clear overview of all job results.
  # Always runs, even if previous jobs fail.
  # ===========================================================================

  summary:
    name: ✅ CI Summary
    needs: [quality, smoke, bootstrap, unit, integration]
    runs-on: ubuntu-latest
    if: always()  # Always run to provide summary, even on failure

    steps:
      - name: Generate CI summary
        run: |
          echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quality.result }}" == "success" ]]; then
            echo "| 📋 Code Quality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.quality.result }}" == "failure" ]]; then
            echo "| 📋 Code Quality | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📋 Code Quality | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.smoke.result }}" == "success" ]]; then
            echo "| 🚦 Smoke Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.smoke.result }}" == "failure" ]]; then
            echo "| 🚦 Smoke Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🚦 Smoke Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.bootstrap.result }}" == "success" ]]; then
            echo "| 🔧 Bootstrap Config | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.bootstrap.result }}" == "failure" ]]; then
            echo "| 🔧 Bootstrap Config | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔧 Bootstrap Config | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.unit.result }}" == "success" ]]; then
            echo "| 🧪 Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.unit.result }}" == "failure" ]]; then
            echo "| 🧪 Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Unit Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.integration.result }}" == "success" ]]; then
            echo "| 🔗 Integration Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.integration.result }}" == "failure" ]]; then
            echo "| 🔗 Integration Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔗 Integration Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [[ "${{ needs.quality.result }}" == "success" ]] && \
             [[ "${{ needs.smoke.result }}" == "success" ]] && \
             [[ "${{ needs.bootstrap.result }}" == "success" ]] && \
             [[ "${{ needs.unit.result }}" == "success" ]] && \
             [[ "${{ needs.integration.result }}" == "success" ]]; then
            echo "### 🎉 All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
          fi
