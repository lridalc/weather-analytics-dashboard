name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:  # Allows this workflow to be called from ci.yml

jobs:
  smoke:
    name: Entrypoint Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run smoke tests
        run: uv run pytest tests/integration/test_00_smoke.py -v --tb=short