name: Smoke Tests

on:
  workflow_call:  # Allows this workflow to be called from ci.yaml
  workflow_dispatch:  # Allows this workflow to be manually called from GitHub UI

jobs:
  smoke:
    name: Entrypoint Verification
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-python-uv-action

      - name: Run smoke tests
        run: uv run pytest tests/integration/test_00_smoke.py -v --tb=short
