[project]
name = "weather-analytics-dashboard"
version = "0.1.0"
authors = [{ name = "lridalc", email = "lridalc1m@gmail.com" }]
description = "Weather Analytics Dashboard with REST API and CLI"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["weather", "analytics", "dashboard", "cli", "fastapi"]
dependencies = [
    "aiosqlite>=0.22.1",
    "click>=8.3.2",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.44.0",
]

[project.urls]
Repository = "https://github.com/lridalc/weather-analytics-dashboard"

[project.scripts]
weather = "weather_analytics_dashboard.presentation.cli.main:cli"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.10",
]

[tool.ruff]
# line-length = 88 by default
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
strict_optional = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[build-system]
requires = ["uv_build >= 0.11.6, <0.12.0"]
build-backend = "uv_build"